    <main class="data-container">
      <h1>Users Data</h1>

      <div class="controls">
        <label for="searchInput">Search by name or email</label>
        <input type="search" id="searchInput" placeholder="Type to search..." />

        <button type="button" id="sortNameButton">Sort by Name</button>

        <button type="button" id="sortAgeButton">Sort by Age</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Age</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>

      <p id="emptyMessage" role="status"></p>
    </main>
